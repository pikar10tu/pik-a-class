name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (ใช้ในเทส DOM ของหน้า admin) ต้องการ Node ^22.22 หรือ ^24.15 ขึ้นไป — Node 20 โหลดไม่ขึ้น
          node-version: 24
      - run: npm ci
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:rules
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Pages เสิร์ฟแค่ไฟล์ static — security rules กับ composite indexes อยู่ฝั่ง Firestore
  # ต้อง deploy แยกต่างหาก ไม่งั้นกฎใหม่ (เช่น เจ้าของ stageClears, คะแนนห้ามลด, allowlist ฟิลด์ consent)
  # และ index ของ stages/exercises จะไม่ขึ้น production แม้เว็บจะอัปเดตแล้ว
  # ต้องมี secret FIREBASE_SERVICE_ACCOUNT (service account JSON ทั้งก้อน สิทธิ์ Firebase Rules Admin
  # + Cloud Datastore Index Admin) ถ้ายังไม่ได้ตั้ง job นี้จะเตือนแล้วข้ามไป ไม่ทำให้ build ล้ม
  # แล้วต้องรันมือตามขั้นตอนใน docs/deploy.md แทน
  firestore:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - id: secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Firestore rules and indexes
        if: steps.secret.outputs.present == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          trap 'rm -f "$RUNNER_TEMP/firebase-sa.json"' EXIT
          npx firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project "${FIREBASE_PROJECT:-pik-a-class}" \
            --non-interactive
      - name: Say plainly that rules and indexes were NOT deployed
        if: steps.secret.outputs.present != 'true'
        run: |
          echo "::warning title=Firestore rules/indexes not deployed::secret FIREBASE_SERVICE_ACCOUNT is not set. Run the manual command in docs/deploy.md before letting students in."
