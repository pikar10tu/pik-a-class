name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (ใช้ในเทส DOM ของหน้า admin) ต้องการ Node ^22.22 หรือ ^24.15 ขึ้นไป — Node 20 โหลดไม่ขึ้น
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run check:vocab
      - run: npm run check:content
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:rules
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Pages เสิร์ฟแค่ไฟล์ static — security rules กับ composite indexes อยู่ฝั่ง Firestore
  # ต้อง deploy แยกต่างหาก ไม่งั้นกฎใหม่ (เช่น เจ้าของ stageClears, คะแนนห้ามลด, allowlist ฟิลด์ consent)
  # และ index ของ stages/exercises จะไม่ขึ้น production แม้เว็บจะอัปเดตแล้ว
  # ต้องมี secret FIREBASE_SERVICE_ACCOUNT (service account JSON ทั้งก้อน สิทธิ์ Firebase Rules Admin
  # + Cloud Datastore Index Admin) ถ้ายังไม่ได้ตั้ง job นี้จะ FAIL ทั้ง run (ไม่ใช่แค่เตือนแล้วผ่าน —
  # เพราะเว็บใหม่ที่ deploy ไปพร้อม rules/index เก่าคือสถานะไม่ปลอดภัยที่เคยเกิดมาแล้ว)
  # ต้อง deploy ก่อน job deploy (Pages) เสมอเมื่อ secret มี ตามที่ docs/deploy.md ระบุไว้ — ไม่ใช่รันขนานกัน
  # ถ้า secret ยังไม่มี job นี้จะแดงเพื่อเตือน แต่ job deploy (Pages) จะไม่ถูก block ตามไปด้วย (ดู
  # เงื่อนไข if: ของ job deploy ด้านล่าง) เพราะ block เว็บทั้งเว็บไว้ไม่ได้ป้องกันอะไรเพิ่ม — ให้รันมือ
  # ตามขั้นตอนใน docs/deploy.md แทนจนกว่าจะตั้ง secret เสร็จ
  firestore:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      secret_present: ${{ steps.secret.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - id: secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fail loudly when the Firestore deploy secret is missing
        if: steps.secret.outputs.present != 'true'
        run: |
          echo "::error title=Firestore rules/indexes NOT deployed::Repository secret FIREBASE_SERVICE_ACCOUNT is not set, so this job cannot run 'firebase deploy --only firestore:rules,firestore:indexes'. This job now fails instead of skipping, because a green run that never shipped rules/indexes is exactly what let insecure rules sit in production before. See docs/deploy.md ('ทำให้อัตโนมัติ') for how to create the secret (service account needs IAM roles Firebase Rules Admin + Cloud Datastore Index Admin). Until the secret exists, run this manual command yourself before letting students use any new web deploy: npx firebase login && npx firebase deploy --only firestore:rules,firestore:indexes --project pik-a-class"
          exit 1
      - name: Deploy Firestore rules and indexes
        if: steps.secret.outputs.present == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          trap 'rm -f "$RUNNER_TEMP/firebase-sa.json"' EXIT
          npx firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project "${FIREBASE_PROJECT:-pik-a-class}" \
            --non-interactive

  # Firestore ต้องขึ้นก่อนเว็บเสมอเมื่อมันขึ้นได้จริง (ดู docs/deploy.md) จึงต้อง needs ทั้ง build
  # และ firestore ไม่ใช่แค่ build — กัน job นี้กับ firestore รันขนานกัน
  # แต่ "firestore ล้มเหลว" มีสองแบบที่ต้องแยกกัน (secret ยังไม่มี VS secret มีแต่ deploy จริงพัง):
  #   - secret ไม่มี (present != 'true'): เป็นช่องโหว่โครงสร้างที่รู้อยู่แล้วและมีทางแก้แบบรันมือ
  #     (docs/deploy.md) ไม่ใช่ของพังจากโค้ด job firestore จะยังแดงเพื่อเตือน แต่เว็บต้อง deploy ต่อได้
  #     เพราะ block เว็บทั้งเว็บไว้ไม่ได้ป้องกันอะไรเพิ่มเลย ในเมื่อ rules/index ต้องรันมืออยู่แล้ว
  #   - secret มีแต่ npx firebase deploy ล้มจริง (steps.secret.outputs.present == 'true' แต่ job fail):
  #     คือของพังจริง ต้อง block เว็บไว้เหมือนเดิม
  deploy:
    needs: [build, firestore]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.firestore.result == 'success' || needs.firestore.outputs.secret_present != 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
