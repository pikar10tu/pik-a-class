<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>เส้นทางด่าน — Pik a Class</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <meta name="theme-color" content="#37c871" />
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/learn.css" />
</head>
<body>
  <main class="learn-main">
    <header class="path-header">
      <a id="back-link" class="btn-nav-back" href="#">← กลับเลือกบทเรียน</a>
      <a id="handbook-pill-link" class="path-handbook-pill" href="#" hidden>📖 สรุปไวยากรณ์</a>
      <span id="total-stars" class="stars path-total-stars"></span>
    </header>
    <div id="path-banner-wrap" class="path-banner-wrap" hidden>
      <img id="path-banner-img" class="path-banner-img" alt="ภาพเกาะลอยฟ้า" />
    </div>
    <h1 id="path-title" class="learn-title"></h1>
    <p id="path-summary" class="hint path-summary"></p>

    <p id="loading-note" class="hint">กำลังโหลด…</p>

    <div id="empty-state" class="path-empty" hidden>
      <img id="empty-mascot" class="learn-mascot" width="96" height="138" alt="น้องหยกยิ้ม" />
      <p id="empty-message" class="hint"></p>
      <a id="empty-back" class="btn-chunky path-empty-link" href="#">กลับไปเลือกบทเรียน</a>
    </div>

    <div id="path-canvas" class="path-canvas" hidden></div>
    <div id="path-bottom-exit" class="path-bottom-exit" hidden>
      <a id="bottom-back-link" class="path-bottom-back-btn" href="#">← กลับไปเลือกบทเรียน</a>
    </div>
  </main>

  <button id="snap-active-btn" class="path-fab-active" type="button" title="ไปยังด่านปัจจุบัน" aria-label="ไปยังด่านปัจจุบัน" hidden>
    <span>🎯 ด่านปัจจุบัน</span>
  </button>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden>
    <section class="sheet">
      <p id="sheet-badge" class="hint"></p>
      <h2 id="sheet-title"></h2>
      <p id="sheet-meta" class="hint"></p>
      <div id="sheet-concept" class="sheet-concept-card" hidden></div>
      <p id="sheet-best"></p>
      <button type="button" id="sheet-start" class="btn-chunky">เริ่มเล่น</button>
      <button type="button" id="sheet-close" class="btn-ghost" style="margin-top: var(--space-2);">ปิด</button>
    </section>
  </div>
  <script type="module" src="./path.js"></script>
</body>
</html>
