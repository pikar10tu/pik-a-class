<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>เล่นด่าน — Pik a Class</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <meta name="theme-color" content="#37c871" />
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/learn.css" />
</head>
<body>
  <main class="learn-main">
    <section id="play-view" hidden>
      <header style="display: flex; align-items: center; gap: var(--space-2);">
        <button type="button" id="quit" class="btn-ghost btn-quit" aria-label="ออกจากด่าน">✕</button>
        <span class="progress-bar"><span id="progress-fill" style="width: 0%"></span></span>
        <span id="progress-text"></span>
        <button type="button" id="btn-grammar-note" class="btn-ghost btn-concept" aria-label="ดูสรุปไวยากรณ์" title="ดูสรุปไวยากรณ์" hidden>💡 สรุป</button>
        <button type="button" id="mute-toggle" class="btn-ghost btn-mute" aria-pressed="false" aria-label="ปิดเสียงตอบคำถาม">ปิดเสียง</button>
      </header>
      <p id="question-label" style="color: var(--color-muted); font-size: 0.8125rem;"></p>
      <h1 id="question-prompt" style="font-size: 1.3125rem; font-weight: 500;"></h1>
      <div id="answers"></div>
      <div id="verdict" hidden>
        <p id="verdict-text"></p>
        <button type="button" id="next" class="btn-chunky">ต่อไป</button>
      </div>
    </section>

    <section id="result-view" hidden style="text-align: center;">
      <img id="result-mascot" class="learn-mascot learn-mascot--result" width="140" height="201" alt="" />
      <h1 id="result-title"></h1>
      <p id="result-stars" class="stars" style="font-size: 2rem;"></p>
      <p id="result-score"></p>
      <p id="save-state"></p>
      <div id="result-actions" style="margin-top: var(--space-4);">
        <button type="button" id="back-to-path" class="btn-chunky">ไปต่อ</button>
        <button type="button" id="retry" class="btn-ghost" style="margin-top: var(--space-2);">เล่นด่านนี้อีกครั้ง</button>
      </div>
    </section>

    <section id="empty-state" class="path-empty" hidden>
      <img id="empty-mascot" class="learn-mascot" width="96" height="138" alt="" />
      <p id="empty-message" class="hint"></p>
      <a id="empty-back" class="btn-chunky path-empty-link" href="#">กลับเส้นทางด่าน</a>
    </section>

    <div id="note-backdrop" class="sheet-backdrop" hidden>
      <section class="sheet note-sheet">
        <div class="note-sheet-header">
          <div class="note-header-left">
            <span class="concept-card-badge">💡 สรุปไวยากรณ์</span>
            <h2 id="note-title" class="note-title"></h2>
          </div>
          <button type="button" id="note-close-icon" class="btn-ghost btn-quit" aria-label="ปิดสรุป">✕</button>
        </div>
        <div id="note-body" class="note-body"></div>
        <button type="button" id="note-close-btn" class="btn-chunky" style="margin-top: var(--space-3);">เข้าใจแล้ว ทำต่อ</button>
      </section>
    </div>
  </main>
  <script type="module" src="./play.js"></script>
</body>
</html>
